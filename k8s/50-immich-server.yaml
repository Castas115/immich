apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: pc2
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v3.2.4
          env:
            - { name: DB_HOSTNAME, value: immich-postgres }
            - { name: DB_USERNAME, value: immich }
            - { name: DB_DATABASE_NAME, value: immich }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-secret
                  key: POSTGRES_PASSWORD
            - { name: REDIS_HOSTNAME, value: immich-redis }
            - { name: IMMICH_MACHINE_LEARNING_URL, value: "http://immich-machine-learning:3003" }
            - { name: TZ, value: "Europe/Madrid" }
            - { name: NODE_EXTRA_CA_CERTS, value: /etc/ssl/custom/ca.crt }
          ports:
            - name: http
              containerPort: 2283
          volumeMounts:
            - { name: library, mountPath: /usr/src/app/upload }
            - { name: home-ca-cert, mountPath: /etc/ssl/custom }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 4Gi }
          readinessProbe:
            httpGet: { path: /api/server/ping, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/server/ping, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich-library
        - name: home-ca-cert
          configMap:
            name: home-ca-cert
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  type: LoadBalancer
  selector:
    app: immich-server
  ports:
    - name: http
      port: 2283
      targetPort: http
